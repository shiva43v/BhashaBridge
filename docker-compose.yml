name: bhashabridge

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bhashabridge}
      POSTGRES_USER: ${POSTGRES_USER:-bhasha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bhasha}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bhashabridge}
      SARVAM_API_KEY: ${SARVAM_API_KEY:?Set SARVAM_API_KEY in .env}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  agent:
    build: ./agent
    restart: unless-stopped
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:?Set NEXT_PUBLIC_LIVEKIT_URL in .env}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
